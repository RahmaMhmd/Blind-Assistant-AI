models:
  rtdetrv2-r18-int8:
    task: object_detection
    adapter: onnx_detector
    params:
      model_path: models/onnx_int8/rtdetrv2_r18_int8.onnx
      input_size: 640
      input_name: pixel_values
      conf_threshold: 0.5

  dfine-small-int8:
    task: object_detection
    adapter: onnx_detector
    params:
      model_path: models/onnx_int8/dfine_small_int8.onnx
      input_size: 640
      input_name: pixel_values
      conf_threshold: 0.5

  mobilenetv3-large-int8:
    task: image_classification
    adapter: onnx_classifier
    params:
      model_path: models/onnx_int8/mobilenetv3_large_int8.onnx
      input_size: 224
      input_name: pixel_values
      mean:
        - 0.485
        - 0.456
        - 0.406
      std:
        - 0.229
        - 0.224
        - 0.225

  mobilenetv3-egp-fp32:
    task: image_classification
    adapter: onnx_classifier
    params:
      model_path: models/onnx_fp32/mobilenetv3_large_egp_fp32.onnx
      input_size: 224
      input_name: pixel_values
      labels: ["5", "10", "20", "50", "100", "200"]
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  mobilenetv3-egp-int8:
    task: image_classification
    adapter: onnx_classifier
    params:
      model_path: models/onnx_int8/mobilenetv3_large_egp_int8.onnx
      input_size: 224
      input_name: pixel_values
      labels: ["5", "10", "20", "50", "100", "200"]
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
